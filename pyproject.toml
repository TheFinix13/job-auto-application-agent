[project]
name = "job-agent"
version = "0.1.0"
description = "Finds jobs, scores them, drafts documents from verified facts, and never submits without approval."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
